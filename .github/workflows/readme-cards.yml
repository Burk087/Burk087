name: Atualizar cards do README

on:
  schedule:
    - cron: "0 3 * * *" # todo dia, meia-noite no horário de Brasília
  workflow_dispatch:     # permite rodar manualmente pela aba Actions

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Card de estatísticas
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&locale=pt-br&hide_border=true&bg_color=10051F&title_color=D8B4FE&icon_color=A78BFA&text_color=E9D5FF&ring_color=8054B8&card_width=495"
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cobrinha de contribuições
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/snake.svg?color_snake=#C084FC&color_dots=#161b22,#2A1450,#432078,#6D42A6,#A78BFA

      - name: Salvar cards no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Atualiza cards do README" || exit 0
          git push
